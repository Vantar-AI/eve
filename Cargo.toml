[package]
name = "eve-language"
version = "0.1.0"
edition = "2024"
description = "Experimental graph-native conversation language for distributed AI systems"
license = "Apache-2.0"
repository = "https://github.com/Vantar-AI/eve"
publish = false

[lib]
name = "eve"
path = "src/lib.rs"

[[bin]]
name = "eve"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
