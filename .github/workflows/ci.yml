name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install JSON Schema validator
        run: python -m pip install check-jsonschema==0.37.4

      - name: Validate Eve Graph example
        run: check-jsonschema --schemafile spec/eve-graph-v0.schema.json examples/hello.evegraph.json

      - name: Validate Eve Conversation example
        run: check-jsonschema --schemafile spec/eve-conversation-v0.schema.json examples/generate.eveconv.json

      - name: Compile and validate Eve Plan
        run: |
          cargo run --locked -- compile
          check-jsonschema --schemafile spec/eve-plan-v0.schema.json build/generate.eveplan.json
          cargo run --locked -- run-plan build/generate.eveplan.json --wire compact --transport memory
